.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button{font:inherit;font-size:14px;letter-spacing:1px;color:var(--fg);background:var(--chip);border:1px solid var(--dim);padding:10px 18px;min-height:44px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--fg)}
button:focus-visible{outline:2px solid var(--hi);outline-offset:2px}
button:disabled{opacity:.35;cursor:default}
button.go{border-color:var(--acc);color:#000;background:var(--acc);font-weight:700;font-size:16px;padding:12px 30px}
button.sel{border-color:var(--fg);color:var(--hi)}
#snd{width:44px;height:44px;padding:0;display:inline-flex;align-items:center;justify-content:center;border-color:var(--fg)}
#snd.off{border-color:var(--dim);color:var(--mut)}
.drop{flex:1;min-width:0;border:1px dashed var(--dim);padding:12px 14px;min-height:44px;font-size:15px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:12px}
.drop.hot{border-color:var(--fg)}
.sec{color:var(--mut);font-size:13px;letter-spacing:2px;margin:22px 0 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.t{display:flex;align-items:center;gap:10px;border:1px solid var(--dim);background:var(--chip);padding:11px 12px;min-height:46px;font-size:15px;position:relative;cursor:pointer;user-select:none}
.t:hover,.t:focus-visible{border-color:var(--fg);outline:none}
.t.on{border-color:var(--fg);background:#0d2210}
.t.fx{border-style:dashed}.t.exp{border-style:dashed;border-color:#7a2020}.t.exp.on{background:#2a0c0c;border-color:var(--bad)}
.t .n{flex:1;color:var(--hi);min-width:0;line-height:1.25}
.t .box{width:14px;height:14px;border:1px solid var(--fg);flex:none}.t.on .box{background:var(--fg)}
.tip{display:none;position:absolute;left:0;top:calc(100% + 4px);z-index:20;width:320px;max-width:84vw;background:#000;border:1px solid var(--fg);padding:10px 12px;font-size:14px;color:var(--fg);white-space:normal;cursor:default}
.tip.l{left:auto;right:0}
.t:hover .tip,.t:focus-visible .tip{display:block}
.tip .x{display:block;color:var(--acc);margin-top:3px}.tip .xp{display:block;color:var(--bad);margin-top:3px}
.ok{color:var(--fg)}.warn{color:var(--acc)}.bad{color:var(--bad)}
#result{border:1px solid var(--dim);padding:14px 16px;margin-top:14px;font-size:15px}
.foot{color:#3a8a4a;font-size:13px;margin-top:22px}
@media (max-width:560px){.logo{font-size:8px}.grid{grid-template-columns:1fr}}
