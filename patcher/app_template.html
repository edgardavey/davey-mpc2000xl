<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DAVEY MPC PATCHER</title>
<style>
:root{--bg:#050805;--fg:#8dff9a;--hi:#d6ffdb;--mut:#3f9a52;--dim:#1f5a2a;--chip:#0b130b;--acc:#ffb000;--bad:#ff4040;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.4 "SF Mono",ui-monospace,Menlo,Consolas,monospace}
body::after{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.25) 0 1px,transparent 1px 3px);z-index:50}
main{max-width:780px;margin:0 auto;padding:14px 16px 30px}
.logo{white-space:pre;color:var(--hi);font-size:10px;line-height:1.05;margin:0;text-shadow:0 0 6px rgba(57,255,106,.45)}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap}
.tag{color:var(--mut);font-size:11px;letter-spacing:2px}#t_tag{margin-top:8px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button{font:inherit;font-size:12px;letter-spacing:1px;color:var(--fg);background:var(--chip);border:1px solid var(--dim);padding:5px 12px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--fg)}
button:focus-visible{outline:2px solid var(--hi);outline-offset:2px}
button:disabled{opacity:.35;cursor:default}
button.go{border-color:var(--acc);color:#000;background:var(--acc);font-weight:700;padding:7px 18px}
button.sel{border-color:var(--fg);color:var(--hi)}
#snd{width:34px;height:30px;padding:0;display:inline-flex;align-items:center;justify-content:center;border-color:var(--fg)}
#snd.off{border-color:var(--dim);color:var(--mut)}
.bar{position:sticky;top:0;background:var(--bg);padding:10px 0 8px;border-bottom:1px solid var(--dim);margin:10px 0;z-index:10}
#segs{display:flex;gap:2px;height:14px}
#segs i{flex:1;border:1px solid #143514;background:#0b140b;transition:background .12s}
#segs i.on{background:var(--fg);border-color:var(--fg);box-shadow:0 0 5px rgba(57,255,106,.6)}
#segs i.on.hot{background:var(--acc);border-color:var(--acc)}
#segs i.gh{background:#2a4a2a;border-color:#4a8a4a}
#segs i.lim{border-right:2px solid var(--hi)}
.drop{flex:1;min-width:0;border:1px dashed var(--dim);padding:8px 10px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drop.hot{border-color:var(--fg)}
.sec{color:var(--mut);font-size:11px;letter-spacing:2px;margin:14px 0 6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:5px}
.t{display:flex;align-items:center;gap:7px;border:1px solid var(--dim);background:var(--chip);padding:6px 8px;position:relative;cursor:pointer;user-select:none}
.t:hover,.t:focus-visible{border-color:var(--fg);outline:none}
.t.on{border-color:var(--fg);background:#0d2210}
.t.fx{border-style:dashed}.t.exp{border-style:dashed;border-color:#7a2020}.t.exp.on{background:#2a0c0c;border-color:var(--bad)}
.t .n{flex:1;color:var(--hi);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t .p{font-size:11px;color:var(--mut)}.t .p.w2{color:var(--acc)}
.t .box{width:11px;height:11px;border:1px solid var(--fg);flex:none}.t.on .box{background:var(--fg)}
.pair{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center}
.or{color:var(--acc);font-size:11px}
.tip{display:none;position:absolute;left:0;top:calc(100% + 4px);z-index:20;width:260px;max-width:80vw;background:#000;border:1px solid var(--fg);padding:6px 8px;font-size:12px;color:var(--fg);white-space:normal;cursor:default}
.tip.l{left:auto;right:0}
.t:hover .tip,.t:focus-visible .tip{display:block}
.tip b{color:var(--hi)}.tip .x{display:block;color:var(--acc);margin-top:3px}.tip .xp{display:block;color:var(--bad);margin-top:3px}
.ok{color:var(--fg)}.warn{color:var(--acc)}.bad{color:var(--bad)}
.mono{word-break:break-all}
#result{border:1px solid var(--dim);padding:10px 12px;margin-top:12px}
#result label{display:flex;gap:8px;align-items:flex-start;margin:5px 0;cursor:pointer}
#result input{accent-color:var(--fg);margin-top:2px}
.safe{display:flex;gap:16px;flex-wrap:wrap;color:var(--mut);font-size:12px;margin-top:16px;border-top:1px dashed var(--dim);padding-top:10px}
.safe span::before{content:"▸ ";color:var(--acc)}
.foot{color:#2c6a38;font-size:11px;margin-top:12px;white-space:nowrap;overflow:hidden}
.link{background:none;border:none;padding:0;color:var(--mut);text-decoration:underline;font-size:12px;letter-spacing:0}
@media (max-width:520px){.logo{font-size:7px}.pair{grid-template-columns:1fr}.or{text-align:center}}
@media (prefers-reduced-motion:reduce){#segs i{transition:none}}

let lang = 'en', original = null, fstate = null, sel = new Set(DATA.meter.sets[DATA.meter.limit_set]), last = null, building = false, urls = [];

function closureSafe(S) { try { return MPCEngine.closure(DATA, [...S]); } catch (e) { return null; } }

function clearResult() { urls.forEach(u => URL.revokeObjectURL(u)); urls = []; last = null; $('result').hidden = true; $('result').innerHTML = ''; }

    (id === 'delay670' ? '<span class="x">' + t().fx + '</span>' : '') + (m.experimental ? '<span class="xp">' + t().exp + '</span>' : '');

  el.onmouseenter = () => { el.querySelector('.tip').classList.toggle('l', el.getBoundingClientRect().left + 280 > document.documentElement.clientWidth);
    if (on) return; const S = new Set(sel); (opts.adds || [id]).forEach(x => S.add(x)); (opts.removes || []).forEach(x => S.delete(x)); paintSegs(Math.max(0, pts(S) - pts(sel))); };

function render() {

function paintFile() {

['dragleave', 'drop'].forEach(e => dz.addEventListener(e, ev => { ev.preventDefault(); dz.classList.remove('hot'); }));
dz.addEventListener('drop', ev => { const f = ev.dataTransfer.files[0]; if (f) loadFile(f); });
$('langbtn').onclick = () => { lang = ru() ? 'en' : 'ru'; render(); if (last) showResult(); };
function reportText(r, n) {
  return ['DAVEY MPC PATCHER report', 'release: ' + DATA.release, 'input sha256: ' + r.inputSha, 'output sha256: ' + r.sha256, 'size: ' + n,
    'modules: ' + r.modules.join(', '), 'points: ' + r.points + ' / ' + DATA.meter.maximum + ' (tested set ' + DATA.meter.limit + ')',
    'patches: ' + r.patches + ' (xor ' + r.xorPatches + ', verified-old ' + r.setPatches + ')', 'checksum word: 0x' + r.checksum.toString(16).padStart(4, '0') + ' at 0x77FFE',
    'boot region 0x78000-0x7FFFF: unchanged', 'program memory 0x70000-0x741AF: unchanged', 'reference: ' + r.reference,
    'Emulator-tested only. Keep the ORIGINAL MPC2KXL.BIN on the card; restore = LOAD, pick it, DO IT.'].join('\n');
}
function showResult() {
  const T = t(), r = last.report, res = $('result'); urls.forEach(u => URL.revokeObjectURL(u)); urls = [];
  const bin = URL.createObjectURL(new Blob([last.bytes], { type: 'application/octet-stream' })), txt = URL.createObjectURL(new Blob([reportText(r, last.bytes.length)], { type: 'text/plain' }));
  urls = [bin, txt]; const fname = 'MPC2KXL_DAVEY_' + r.sha256.slice(0, 8) + '.BIN';
  const state = r.reference === 'match' ? '<span class="ok">' + T.match + '</span>' : r.reference === 'untested-combination' ? '<span class="warn">' + T.untested + '</span>' : '<span class="bad">' + T.mismatch + '</span>';
  res.innerHTML = '<div>' + state + '</div><div class="mono" style="color:var(--mut);font-size:11px;margin:4px 0 8px">sha ' + r.sha256 + ' · ' + r.points + ' ' + T.pts + '</div>' +
    T.ack.map((a, i) => '<label><input type="checkbox" class="ack" id="ack' + i + '"><span></span></label>').join('') +
    '<div class="row" style="margin-top:8px"><a id="dl" download="' + fname + '" href="' + bin + '"><button class="go" id="savebtn" disabled>' + T.save + '</button></a>' +
    '<a download="' + fname.replace('.BIN', '_report.txt') + '" href="' + txt + '"><button>' + T.report + '</button></a><span style="color:var(--mut);font-size:12px">' + fname + '</span></div>' +
    '<div style="color:var(--mut);font-size:12px;margin-top:6px">' + T.savedhint + '</div>';
  res.querySelectorAll('label span').forEach((s, i) => s.textContent = T.ack[i]);
  const acks = [...res.querySelectorAll('.ack')], dl = $('dl');
  const upd = () => { const ok = acks.every(a => a.checked); $('savebtn').disabled = !ok; dl.style.pointerEvents = ok ? 'auto' : 'none'; };
  acks.forEach(a => a.onchange = upd); upd(); res.hidden = false;
}
$('make').onclick = async () => {
  if (building) return; building = true; clearResult(); $('make').disabled = true; $('status').textContent = '…';
  try { last = await MPCEngine.build(DATA, original, [...sel]); showResult(); $('status').textContent = ''; }
  catch (e) { $('status').innerHTML = '<span class="bad"></span>'; $('status').firstChild.textContent = e.message; }
  building = false; render();
};
$('vpick').onclick = () => $('vfile').click();
$('vfile').onchange = async e => { const f = e.target.files[0]; if (!f) return; const sha = await MPCEngine.sha256(new Uint8Array(await f.arrayBuffer()));
  $('vresult').innerHTML = !last ? '<span class="warn">' + t().vnone + '</span>' : sha === last.report.sha256 ? '<span class="ok">' + t().vsame + '</span>' : '<span class="bad">' + t().vdiff + '</span>'; };
/* music: on by default; browsers allow sound only after the first click or key, so it also starts on the first interaction */
const snd = $('snd');
const ICON_ON = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg>';
const ICON_OFF = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 9l5 6M21 9l-5 6"/></svg>';
const paintSnd = () => { snd.innerHTML = Chip.isOn() ? ICON_ON : ICON_OFF; snd.classList.toggle('off', !Chip.isOn()); };
snd.onclick = e => { e.stopPropagation(); Chip.set(Chip.running() ? !Chip.isOn() : true); paintSnd(); };
const firstTouch = () => { if (Chip.isOn()) Chip.start(); };
['pointerdown', 'keydown'].forEach(ev => document.addEventListener(ev, e => { if (e.target.closest && e.target.closest('#snd')) return; firstTouch(); }, { once: true }));
try { if (Chip.isOn()) Chip.start(); } catch (e) {}
paintSnd();
window.__test = { build: s => MPCEngine.build(DATA, original, s), loadBytes: async b => { original = b; render(); return MPCEngine.sha256(b); }, DATA, sel: () => [...sel], toggle, setSel };
render();
</script></body></html>
