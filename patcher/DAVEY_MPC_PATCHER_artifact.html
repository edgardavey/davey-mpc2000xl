
<title>DAVEY MPC PATCHER</title>
<style>
:root{--bg:#050805;--fg:#8dff9a;--hi:#d6ffdb;--mut:#3f9a52;--dim:#1f5a2a;--chip:#0b130b;--acc:#ffb000;--bad:#ff4040;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.4 "SF Mono",ui-monospace,Menlo,Consolas,monospace}
body::after{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.25) 0 1px,transparent 1px 3px);z-index:50}
main{max-width:780px;margin:0 auto;padding:14px 16px 30px}
.logo{white-space:pre;color:var(--hi);font-size:10px;line-height:1.05;margin:0;text-shadow:0 0 6px rgba(57,255,106,.45)}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap}
.tag{color:var(--mut);font-size:11px;letter-spacing:2px}#t_tag{margin-top:8px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button{font:inherit;font-size:12px;letter-spacing:1px;color:var(--fg);background:var(--chip);border:1px solid var(--dim);padding:5px 12px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--fg)}
button:focus-visible{outline:2px solid var(--hi);outline-offset:2px}
button:disabled{opacity:.35;cursor:default}
button.go{border-color:var(--acc);color:#000;background:var(--acc);font-weight:700;padding:7px 18px}
button.sel{border-color:var(--fg);color:var(--hi)}
#snd{width:34px;height:30px;padding:0;display:inline-flex;align-items:center;justify-content:center;border-color:var(--fg)}
#snd.off{border-color:var(--dim);color:var(--mut)}
.bar{position:sticky;top:0;background:var(--bg);padding:10px 0 8px;border-bottom:1px solid var(--dim);margin:10px 0;z-index:10}
#segs{display:flex;gap:2px;height:14px}
#segs i{flex:1;border:1px solid #143514;background:#0b140b;transition:background .12s}
#segs i.on{background:var(--fg);border-color:var(--fg);box-shadow:0 0 5px rgba(57,255,106,.6)}
#segs i.on.hot{background:var(--acc);border-color:var(--acc)}
#segs i.gh{background:#2a4a2a;border-color:#4a8a4a}
#segs i.lim{border-right:2px solid var(--hi)}
.drop{flex:1;min-width:0;border:1px dashed var(--dim);padding:8px 10px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drop.hot{border-color:var(--fg)}
.sec{color:var(--mut);font-size:11px;letter-spacing:2px;margin:14px 0 6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:5px}
.t{display:flex;align-items:center;gap:7px;border:1px solid var(--dim);background:var(--chip);padding:6px 8px;position:relative;cursor:pointer;user-select:none}
.t:hover,.t:focus-visible{border-color:var(--fg);outline:none}
.t.on{border-color:var(--fg);background:#0d2210}
.t.fx{border-style:dashed}.t.exp{border-style:dashed;border-color:#7a2020}.t.exp.on{background:#2a0c0c;border-color:var(--bad)}
.t .n{flex:1;color:var(--hi);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t .p{font-size:11px;color:var(--mut)}.t .p.w2{color:var(--acc)}
.t .box{width:11px;height:11px;border:1px solid var(--fg);flex:none}.t.on .box{background:var(--fg)}
.pair{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center}
.or{color:var(--acc);font-size:11px}
.tip{display:none;position:absolute;left:0;top:calc(100% + 4px);z-index:20;width:260px;max-width:80vw;background:#000;border:1px solid var(--fg);padding:6px 8px;font-size:12px;color:var(--fg);white-space:normal;cursor:default}
.tip.l{left:auto;right:0}
.t:hover .tip,.t:focus-visible .tip{display:block}
.tip b{color:var(--hi)}.tip .x{display:block;color:var(--acc);margin-top:3px}.tip .xp{display:block;color:var(--bad);margin-top:3px}
.ok{color:var(--fg)}.warn{color:var(--acc)}.bad{color:var(--bad)}
.mono{word-break:break-all}
#result{border:1px solid var(--dim);padding:10px 12px;margin-top:12px}
#result label{display:flex;gap:8px;align-items:flex-start;margin:5px 0;cursor:pointer}
#result input{accent-color:var(--fg);margin-top:2px}
.safe{display:flex;gap:16px;flex-wrap:wrap;color:var(--mut);font-size:12px;margin-top:16px;border-top:1px dashed var(--dim);padding-top:10px}
.safe span::before{content:"▸ ";color:var(--acc)}
.foot{color:#2c6a38;font-size:11px;margin-top:12px;white-space:nowrap;overflow:hidden}
.link{background:none;border:none;padding:0;color:var(--mut);text-decoration:underline;font-size:12px;letter-spacing:0}
@media (max-width:520px){.logo{font-size:7px}.pair{grid-template-columns:1fr}.or{text-align:center}}
@media (prefers-reduced-motion:reduce){#segs i{transition:none}}
</style><main>
